<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 260px;
      margin: 0;
      padding: 14px;
      font-size: 13px;
      color: #1a1a1a;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
    .muted { color: #666; }
    .warn {
      background: #fff3cd; border: 1px solid #ffe08a; border-radius: 6px;
      padding: 8px; margin-top: 10px; font-size: 12px; display: none;
    }
    a { color: #1d9bf0; text-decoration: none; font-size: 12px; }
    .switch { position: relative; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #ccc; border-radius: 999px;
      cursor: pointer; transition: 0.15s;
    }
    .slider::before {
      content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px;
      background: white; border-radius: 50%; transition: 0.15s;
    }
    input:checked + .slider { background: #1d9bf0; }
    input:checked + .slider::before { transform: translateX(16px); }
  </style>
</head>
<body>
  <h1>Clear Eyes</h1>
  <div class="row">
    <span>Filtering</span>
    <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
  </div>
  <div class="row"><span class="muted">Tweets classified</span><b id="classified">–</b></div>
  <div class="row"><span class="muted">Hidden</span><b id="hidden">–</b></div>
  <div class="row"><span class="muted">API calls</span><b id="apiCalls">–</b></div>
  <div class="warn" id="noKey">No API key set. <a href="#" id="openOptions2">Add one in options.</a></div>
  <div class="warn" id="healthWarn">Tweet selectors found nothing on your Home timeline — X may have changed their markup. Filtering is failing open (everything shows).</div>
  <div class="warn" id="lastError"></div>
  <div class="row" style="margin-top:12px">
    <a href="#" id="openOptions">Options</a>
    <a href="#" id="resetStats">reset stats</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
